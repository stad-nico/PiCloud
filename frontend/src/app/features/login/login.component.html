<div class="wrapper">
	<form
		[formGroup]="loginForm"
		(ngSubmit)="onSubmit()">
		<h1>Login</h1>

		<div class="input-box">
			<input
				formControlName="username"
				type="text"
				placeholder="Username"
				required />
		</div>

		<div class="input-box">
			<input
				formControlName="password"
				type="password"
				placeholder="Password"
				required />
		</div>

		<pihub-button
			title="Login"
			[disabled]="loginForm.invalid"
			(buttonClick)="onSubmit()" />

		<div class="register-link">
			<p>Noch keinen Account? <a [routerLink]="['/signup']">Registrieren</a></p>
		</div>
	</form>
</div>
